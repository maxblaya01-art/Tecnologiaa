name: 🚀 Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: 📱 Preparar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: 📦 Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython==0.29.36"

      - name: 🧹 Limpar compilação anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: 🏗️ Compilar APK
        run: |
          buildozer -v android debug

      - name: 📤 Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TecnologiaStore-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
